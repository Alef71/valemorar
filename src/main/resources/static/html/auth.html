<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValeMorar - Entrar</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <a href="home.html" class="brand-logo">ValeMorar</a>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="auth.html">Entrar</a>
            <a href="cadastro.html">Cadastrar</a>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-container">
        <div class="auth-card">
            <h2 class="auth-title">Acesse sua conta</h2>
            
            <div id="mensagem-feedback" class="mensagem-feedback"></div>

            <form id="form-login">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="seuemail@exemplo.com" 
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        placeholder="Sua senha" 
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="btn-submit" id="btn-entrar">Entrar</button>
            </form>

            <p class="auth-switch">
                Ainda não tem conta? <a href="cadastro.html">Cadastrar-se</a>
            </p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="app-footer">
        <p>&copy; 2026 ValeMorar. Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPT DA PÁGINA DE LOGIN -->
    <script src="../js/auth.js"></script>
</body>
</html>
