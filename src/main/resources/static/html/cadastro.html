<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValeMorar - Cadastre-se</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <a href="home.html" class="brand-logo">ValeMorar</a>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="auth.html">Entrar</a>
            <a href="cadastro.html">Cadastrar</a>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-container">
        <div class="auth-card">
            <h2 class="auth-title">Crie sua conta no ValeMorar</h2>
            
            <div id="mensagem-feedback" class="mensagem-feedback"></div>

            <form id="form-cadastro">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input 
                        type="text" 
                        id="nome" 
                        placeholder="Seu nome completo" 
                        minlength="3" 
                        maxlength="100" 
                        required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="seuemail@exemplo.com" 
                        required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        placeholder="Mínimo 8 caracteres" 
                        minlength="8" 
                        autocomplete="new-password"
                        required>
                </div>

                <div class="form-group">
                    <label for="fotoPerfil">URL da Foto de Perfil (Opcional)</label>
                    <input 
                        type="url" 
                        id="fotoPerfil" 
                        placeholder="https://exemplo.com/sua-foto.jpg">
                </div>

                <button type="submit" class="btn-submit" id="btn-cadastrar">Criar Conta</button>
            </form>

            <p class="auth-switch">
                Já tem uma conta? <a href="auth.html">Entrar</a>
            </p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="app-footer">
        <p>&copy; 2026 ValeMorar. Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPT DA PÁGINA DE CADASTRO -->
    <script src="../js/cadastro.js"></script>
</body>
</html>
