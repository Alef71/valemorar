<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Imóvel - Vale Morar</title>

  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <!-- Tailwind CSS CDN Configurado com a Paleta Vale Morar -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['Newsreader', 'serif'],
          },
          colors: {
            brand: {
              green: '#173A2A',
              brown: '#7A4318',
              gold: '#B98232',
              cream: '#F4EFE3',
              greenSoft: '#405B38',
              earthLight: '#A66A2C',
              orange: '#B98232',
              orangeDark: '#A66A2C',
              surface: '#FFFFFF',
              textPrimary: '#1C241E',
              textSecondary: '#5C4F43',
            }
          }
        }
      }
    }
  </script>

  <!-- CSS Externos do Projeto -->
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/global.css">
</head>
<body class="bg-brand-cream text-brand-textPrimary font-sans antialiased flex flex-col min-h-screen">

  <!-- CABEÇALHO / HEADER -->
  <header class="app-header-sticky px-4 sm:px-6 lg:px-12 py-3.5 border-b border-[#dfd7c8] bg-white/90 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">

      <a href="/" class="brand-logo-link flex items-center gap-3 group focus:outline-none">
        <img src="/imagem/vale%20morar.jpeg" alt="Vale Morar" class="h-10 w-auto object-contain rounded-md">
        <div id="header-user-city" class="hidden xl:flex items-center pl-3 border-l border-[#dfd9cc] text-[11px] font-bold tracking-widest text-brand-textSecondary uppercase">
          <!-- Preenchido via JS (header.js) -->
        </div>
      </a>

      <nav class="hidden lg:flex items-center gap-6 text-sm font-medium text-brand-textSecondary">
        <a href="/#cidades" class="nav-link hover:text-brand-green">Explorar Cidades</a>
        <a href="/imoveis?tipoImovel=RESIDENCIAL" class="nav-link hover:text-brand-green">Aluguel Residencial</a>
        <a href="/imoveis?tipoImovel=COMERCIAL" class="nav-link hover:text-brand-green">Aluguel Comercial</a>
        <a href="/imoveis?tipoImovel=CHACARA" class="nav-link hover:text-brand-green">Sítios & Chácaras</a>
      </nav>

      <div id="user-header-actions" class="flex items-center gap-3"></div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 px-4 sm:px-6 lg:px-12 py-8">
    <div class="max-w-7xl mx-auto">

      <a href="/imoveis" class="inline-flex items-center gap-1 text-xs font-bold text-brand-textSecondary hover:text-brand-green mb-5">
        <span class="material-symbols-outlined text-base">arrow_back</span> Voltar para a vitrine
      </a>

      <!-- Estados de carregamento / erro -->
      <p id="anuncio-status" class="text-sm text-brand-textSecondary py-16 text-center">Carregando imóvel...</p>

      <div id="anuncio-conteudo" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- COLUNA PRINCIPAL: fotos + dados do anúncio -->
        <section class="lg:col-span-2 space-y-6">
          <div class="bg-white border border-[#dfd7c8] rounded-2xl overflow-hidden shadow-sm">
            <div class="relative aspect-[16/10] bg-gray-100">
              <img id="foto-principal" src="" alt="Foto do imóvel" class="w-full h-full object-cover">
              <span id="anuncio-modalidade" class="absolute top-4 left-4 bg-brand-green text-white text-[11px] font-bold px-3 py-1 rounded-md uppercase tracking-wider"></span>
            </div>
            <div id="miniaturas" class="hidden flex gap-2 p-3 overflow-x-auto"></div>
          </div>

          <div class="bg-white border border-[#dfd7c8] rounded-2xl p-6 shadow-sm space-y-5">
            <div>
              <p id="anuncio-localizacao" class="text-xs font-bold uppercase tracking-widest text-brand-gold"></p>
              <h1 id="anuncio-titulo" class="text-2xl sm:text-3xl font-extrabold text-brand-textPrimary mt-1"></h1>
            </div>

            <div class="flex flex-wrap items-end gap-x-8 gap-y-2">
              <div>
                <p class="text-xs font-bold text-brand-textSecondary">Aluguel</p>
                <p id="anuncio-valor" class="text-3xl font-extrabold text-brand-green"></p>
              </div>
              <p id="anuncio-custos" class="text-sm text-brand-textSecondary"></p>
            </div>

            <dl id="anuncio-caracteristicas" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></dl>

            <div id="anuncio-tags-bloco" class="hidden">
              <h2 class="text-sm font-bold text-brand-textPrimary mb-2">Pontos de referência próximos</h2>
              <div id="anuncio-tags" class="flex flex-wrap gap-2"></div>
            </div>

            <p id="anuncio-datas" class="text-[11px] text-brand-textSecondary border-t border-[#ece6da] pt-4"></p>
          </div>
        </section>

        <!-- COLUNA LATERAL: contato do anunciante (somente logado) -->
        <aside class="lg:col-span-1">
          <div id="contato-card" class="bg-white border border-[#dfd7c8] rounded-2xl p-6 shadow-sm lg:sticky lg:top-24 space-y-4">
            <h2 class="text-lg font-bold text-brand-textPrimary">Contato do anunciante</h2>
            <div id="contato-conteudo" class="space-y-3 text-sm">
              <p class="text-brand-textSecondary">Carregando...</p>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="bg-brand-cream border-t border-[#dfd7c8] py-8 text-center text-xs text-brand-textSecondary">
    <p>&copy; 2026 Vale Morar Imóveis. Todos os direitos reservados.</p>
  </footer>

  <script src="/js/header.js"></script>
  <script src="/js/anuncio-detalhe.js"></script>
</body>
</html>
