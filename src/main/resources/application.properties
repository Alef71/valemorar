spring.application.name=valemorar
spring.datasource.url=jdbc:postgresql://localhost:5439/valemorar_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Valida o esquema do banco ao iniciar a aplicação
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Configurações do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Config (Secret vindo do ambiente)
jwt.secret=${JWT_SECRET:chave_secreta_minimo_32_caracteres_longa_aqui}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS Config
cors.allowed-origins=http://localhost:3000,http://localhost:5173