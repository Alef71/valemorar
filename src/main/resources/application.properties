spring.application.name=valemorar

# Configurações do Banco de Dados com variáveis de ambiente e valores fallback para dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5439/valemorar_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Configurações do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Config (Secret vindo do ambiente)
jwt.secret=${JWT_SECRET:chave_secreta_minimo_32_caracteres_longa_aqui}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS Config (Origens aceitas separadas por vírgula)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000,http://localhost:5173,http://localhost:8080}