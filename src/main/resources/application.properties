spring.application.name=valemorar

# Variáveis locais de desenvolvimento (arquivo .env na raiz, fora do git). Em produção use variáveis de ambiente.
spring.config.import=optional:file:.env[.properties]

# Configurações do Banco de Dados com variáveis de ambiente e valores fallback para dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5439/valemorar_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
# Schema controlado apenas pelo Flyway (src/main/resources/db/migration); o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Ordenações com campos nulos (ex.: indiceValor sem comparáveis) jogam os nulos para o fim
spring.jpa.properties.hibernate.order_by.default_null_ordering=last

# Configurações do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Config (Secret vindo do ambiente)
# Obrigatório e sem valor padrão: a aplicação não sobe sem JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS Config (Origens aceitas separadas por vírgula)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000,http://localhost:5173,http://localhost:8080}
# Respeita X-Forwarded-For atrás de proxy/load balancer (IP real em aceites e sessões)
server.forward-headers-strategy=native

# Login com Google: client ID OAuth do projeto (vazio = login social desabilitado)
google.client-id=${GOOGLE_CLIENT_ID:}

# Upload de imagens (armazenamento local; os arquivos ficam fora do jar e são servidos em /uploads/**)
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Revisão automática de anúncios (intervalo entre execuções, em ms)
app.revisao.intervalo-ms=${REVISAO_INTERVALO_MS:60000}
